services:
  store-intelligence:
    build: .

    container_name: store-intelligence

    ports:
      - "8000:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3